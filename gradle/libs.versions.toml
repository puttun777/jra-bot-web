# 版数の正本。変更時は docs/VERSIONS.md に理由を記録する（RC/Beta/Milestone/Snapshot は不可）
[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
ktlint = "1.8.0"
flyway = "13.12.0"
doma = "3.14.1"
doma-spring-boot = "3.0.0"
google-cloud-storage = "2.76.0"
# 内部 API の署名付きトークン検証（TokenVerifier）。google-cloud-storage 2.75.0 が引く版（解決結果）に合わせて固定する（D-082）
google-auth-library = "1.55.0"
# :ml-train だけが使う（D-257）。線形代数（Cholesky）・順位・分位点。Apache-2.0、2026-02 公開の 4.0.3（VERSIONS §16）
hipparchus = "4.0.3"

[libraries]
# Boot の BOM（JUnit・Spring 系・mysql-connector-j などの版をここに従わせる）
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# :db-migration だけが使う（D-067）。mysql-connector-j・testcontainers の版は Boot の BOM に従う
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
# :persistence だけが使う（D-070）。Doma は kapt（KSP は公式未対応: VERSIONS §2）。Boot の BOM は管理しない
doma-core = { module = "org.seasar.doma:doma-core", version.ref = "doma" }
doma-kotlin = { module = "org.seasar.doma:doma-kotlin", version.ref = "doma" }
doma-processor = { module = "org.seasar.doma:doma-processor", version.ref = "doma" }
doma-spring-boot-starter = { module = "org.seasar.doma.boot:doma-spring-boot-starter", version.ref = "doma-spring-boot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# :cloud-gcp だけが使う（D-076）。Jackson 3 と slf4j の版は Boot の BOM に従う
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "google-cloud-storage" }
google-auth-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth-library" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
hipparchus-core = { module = "org.hipparchus:hipparchus-core", version.ref = "hipparchus" }
hipparchus-stat = { module = "org.hipparchus:hipparchus-stat", version.ref = "hipparchus" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

# build-logic（規約プラグイン）が使う Gradle プラグイン本体
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
