spring.application.name=dashboard
# Cloud Run は PORT で待受けポートを渡す
server.port=${PORT:8080}
server.shutdown=graceful
# 例外メッセージ・スタックをレスポンスに出さない
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.server-header=
spring.main.banner-mode=off
spring.jmx.enabled=false
# マイグレーションはアプリの起動時に実行しない（CONTRACTS §4.1）。Flyway は :db-migration だけが持つ

# 画面の静的ファイル（ES モジュールの組）は毎回再検証させる（デプロイの直後に新旧のモジュールが混ざって読み込めなくなるのを防ぐ: D-263）。API は各応答で no-store
spring.web.resources.cache.cachecontrol.no-cache=true
