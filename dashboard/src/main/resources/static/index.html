<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JRA Bot ダッシュボード</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header>
  <h1>JRA Bot</h1>
  <div id="statusbar" class="statusbar" role="status" aria-live="polite">読み込み中…</div>
</header>
<nav aria-label="画面">
  <button type="button" data-tab="overview" aria-selected="true">概要</button>
  <button type="button" data-tab="signals" aria-selected="false">シグナル</button>
  <button type="button" data-tab="performance" aria-selected="false">成績</button>
  <button type="button" data-tab="ops" aria-selected="false">運用</button>
  <span class="spacer"></span>
  <label>日付 <input type="date" id="date"></label>
  <button type="button" id="reload">更新</button>
</nav>
<main>
  <section id="overview" class="tab">
    <h2>本日のレース</h2>
    <div id="races" class="table-wrap"></div>
  </section>
  <section id="signals" class="tab" hidden>
    <h2>シグナル</h2>
    <div id="signal-table" class="table-wrap"></div>
    <div class="pager"><button type="button" id="prev">前へ</button><span id="pageinfo"></span><button type="button" id="next">次へ</button></div>
  </section>
  <section id="performance" class="tab" hidden>
    <h2>紙上成績（購入していない仮想の損益）</h2>
    <p class="note">通知した推奨の成績を、確定した結果・払戻から毎回計算しています。結果が無いものは数えず、件数を併記します。</p>
    <label>期間 <input type="date" id="from"> 〜 <input type="date" id="to"></label>
    <div id="perf" class="table-wrap"></div>
  </section>
  <section id="ops" class="tab" hidden>
    <h2>運用</h2>
    <div id="runs" class="table-wrap"></div>
    <div id="admin" hidden>
      <h2>手動補正（管理者のみ・監査記録に残ります）</h2>
      <div id="overrides" class="table-wrap"></div>
      <form id="override-form" autocomplete="off">
        <label>対象 <select id="o-scope"><option value="RACE">レース</option><option value="DAY">開催日</option></select></label>
        <label>操作 <select id="o-action">
          <option value="CANCEL">中止</option><option value="SET_POST_TIME">発走時刻を設定</option><option value="MARK_NO_RACE">開催なし</option>
          <option value="MARK_RACE_DAY">開催あり</option><option value="POSTPONE_TO">延期</option><option value="ALLOW_RUN">実行を許可</option><option value="DENY_RUN">実行を禁止</option>
        </select></label>
        <label>レース ID <input id="o-race" placeholder="202610240511" inputmode="numeric" maxlength="12"></label>
        <label>発走時刻（UTC, ISO） <input id="o-postat" placeholder="2026-10-24T06:30:00Z"></label>
        <label>延期先 <input type="date" id="o-postponed"></label>
        <label>理由（必須） <input id="o-reason" maxlength="500" required></label>
        <button type="submit">補正を追加</button>
        <span id="o-msg" class="note" role="status"></span>
      </form>
    </div>
  </section>
</main>
</body>
</html>
