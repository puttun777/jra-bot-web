name: images

# Docker イメージのビルドとスモーク、ドライランの release-manifest（manifest-preview.json）の生成と検証（T2.5 後半）。
# - 認証なし・push なし・デプロイなし: GCP / Artifact Registry / Docker Hub / GHCR のどれにも認証も push もしない。イメージはランナーのローカルにだけ作る。
# - 実行が重い（Gradle のビルドを含む）ので、ci.yml が「Dockerfile・リリース・ビルド定義が変わったとき」だけ呼び出す。手動実行（workflow_dispatch）もできる。
# - 成果物は manifest-preview.json（deployable=false。本番の release-manifest.json ではない）、smoke-report.json、images-local.json。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: images (build + smoke, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Docker
        run: docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
      - name: Build the 5 images (JVM 4 share one Gradle build stage; ml-train is Kotlin; local only, no push)
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse HEAD)"
          start=$(date +%s)
          for t in db-migration bot ingest dashboard ml-train; do
            docker build --progress=plain --target "$t" --build-arg GIT_SHA="$GIT_SHA" -t "jra-bot/$t:$GIT_SHA" . 2>&1 | tail -n 40
          done
          echo "build seconds: $(( $(date +%s) - start ))"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^jra-bot/'
        shell: bash
      - name: Pull the CI-only MySQL image
        run: docker pull mysql:8.4
      - name: Security and startup smoke (non-root, ENTRYPOINT, exit codes, secrets, JDK 25, SIGTERM; CI-only MySQL with synthetic data)
        run: node build/tools/src/main.js image-smoke --git-sha "$(git rev-parse HEAD)" --report-dir out
      - name: Dry-run manifest (preview; not deployable) - generate, validate, reproducibility
        run: |
          set -eu
          GIT_SHA="$(git rev-parse HEAD)"
          BUILT_AT="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2; do
            node build/tools/src/main.js release preview --git-sha "$GIT_SHA" --built-at "$BUILT_AT" --local-images out/images-local.json --out "out/preview-$i.json"
          done
          cmp out/preview-1.json out/preview-2.json
          mv out/preview-1.json out/manifest-preview.json
          rm out/preview-2.json
          node build/tools/src/main.js release validate --kind preview --expect-git-sha "$GIT_SHA" out/manifest-preview.json
          # プレビューは本番用としては必ず拒否される（拒否されなければ失敗）
          rc=0; node build/tools/src/main.js release validate --kind production out/manifest-preview.json || rc=$?
          test "$rc" = 1
          {
            echo "## images (dry run)"
            echo "- git_sha: \`$GIT_SHA\`"
            echo "- manifest-preview.json: deployable=false（レジストリへ push していないので digest は無い。ローカル image ID は digest ではない）"
            echo "- ml-train: ビルドして合成データセットで学習・署名・登録のスモークを実行（push しない）"
            docker image ls --format '- {{.Repository}}:{{.Tag}} {{.Size}}' | grep 'jra-bot/' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dry-run artifacts (smoke report and manifest preview)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-dry-run
          path: out/
          retention-days: 14
          if-no-files-found: warn

  # AWS の既定は Graviton（arm64。t4g。D-284）。同じ Dockerfile を arm64 のランナーで**ネイティブに**ビルドし、同じスモーク（非 root・終了コード・
  # SIGTERM・合成データの MySQL・AWS の配線）を実行して、ベースイメージ・JDK・ネイティブライブラリが arm64 で動くことを確かめる（QEMU の模擬ではない）。
  # Public リポジトリの標準ランナー（ubuntu-24.04-arm）は無料。manifest のプレビューは amd64 側だけで作る（内容は同じ）。
  images-arm64:
    name: images arm64 (build + smoke, no push)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Docker and architecture
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          test "$(docker info --format '{{.Architecture}}')" = aarch64
      - name: Build the 5 images natively on arm64 (local only, no push)
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse HEAD)"
          for t in db-migration bot ingest dashboard ml-train; do
            docker build --progress=plain --target "$t" --build-arg GIT_SHA="$GIT_SHA" -t "jra-bot/$t:$GIT_SHA" . 2>&1 | tail -n 20
            test "$(docker image inspect -f '{{.Architecture}}' "jra-bot/$t:$GIT_SHA")" = arm64
          done
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^jra-bot/'
        shell: bash
      - name: Pull the CI-only MySQL image (arm64)
        run: docker pull mysql:8.4
      - name: Security and startup smoke on arm64
        run: node build/tools/src/main.js image-smoke --git-sha "$(git rev-parse HEAD)" --report-dir out-arm64
      - name: Upload the arm64 smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-arm64-smoke
          path: out-arm64/
          retention-days: 14
          if-no-files-found: warn
