name: ci

# 変更内容に応じて重いジョブだけを実行する（GitHub Free の月 2,000 分枠の節約。tools/ci/classify.py）。
# - `changes` が変更ファイルを分類する（fail closed: 分類・差分取得に失敗したら全部実行）。docs だけの変更は `changes` と `ci gate` だけ。
# - **分岐保護の required check は `ci gate` だけにする**。ワークフロー全体を paths で止めると required check が Pending のまま残るため使わない。
#   `ci gate` は常に実行され、実行が必要なジョブが success でなければ失敗する。skipped を『テストした』とは数えない（要約に『未実施』と出す）。
# - 契機: PR、main への push（push 前後の差分で同じ判定）、手動（フル検証）、月次（フル検証 + Connector/J 26.x）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 1 * *" # 毎月 1 日 18:23 UTC（日本時間 2 日 03:23）。フル検証

# 最小権限。Secrets は使わない・クラウドの認証情報も使わない（PR から本番へアクセスしない）。
permissions:
  contents: read

# PR は新しい push で古い実行を止める。main の push は止めない（途中のコミットの検証を落とさない）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更判定 + 秘密/実データの混入検査（常に実行。ジョブ数を増やさないよう 1 つにまとめる: 課金はジョブごとに分単位で切り上げ）
  changes:
    name: changes and repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_golden: ${{ steps.classify.outputs.run_golden }}
      run_release: ${{ steps.classify.outputs.run_release }}
      run_images: ${{ steps.classify.outputs.run_images }}
      run_connectorj26: ${{ steps.classify.outputs.run_connectorj26 }}
      db_matrix: ${{ steps.classify.outputs.db_matrix }}
      db_suites: ${{ steps.classify.outputs.db_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 差分（PR の merge コミットの第 1 親、push の before）を取るため
      - name: Classify changed files (fail closed)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m tools.ci.classify
      - name: Check tracked files (secrets / real data)
        run: bash .github/scripts/check-repo-hygiene.sh

  build:
    name: build (Temurin 25)
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_JDK: "25" # JdkRuntimeTest が、テストの JVM が 25 であることを検証する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Wrapper jar の検証もここで行われる（既定で有効）。Gradle のキャッシュは main 以外では書かない（PR が main 用のキャッシュを汚染しない）。
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains
      # Kotlin コンパイル + 単体テスト + ktlint + checkModuleDependencies（+ build-logic の依存規則テスト）
      - name: Build and check
        run: ./gradlew build --stacktrace
      - name: Dependency rules (explicit)
        run: ./gradlew checkModuleDependencies ktlintCheck
      # Kotlin（:domain）の計算結果と、旧 Python（固定コミット f7dbf69）のフィクスチャの比較（T3.1）。各ケース自身の comparison_rules（許容誤差・型・キー・順序）で比較し、
      # Kotlin が『対応』と申告したケースだけを比べる。未対応のケースは成功に数えず、ケース数・呼び出し数を別に報告する（対応表は tools/golden/catalog.py の KOTLIN_PORT）。
      # フィクスチャは CI が書き換えない（sha256 を verify で確認）。標準ライブラリの Python だけで動く（numpy・旧実装は不要）。
      - name: Kotlin vs legacy golden comparison
        run: |
          python3 -m tools.golden.verify
          mkdir -p "$RUNNER_TEMP/golden"
          ./gradlew :golden-runner:run --stacktrace --args="--fixtures $PWD/tools/golden/fixtures --out $RUNNER_TEMP/golden/kotlin_out.json --coverage $RUNNER_TEMP/golden/kotlin_coverage.json"
          python3 -m tools.golden.kotlin_compare --actual "$RUNNER_TEMP/golden/kotlin_out.json" --coverage "$RUNNER_TEMP/golden/kotlin_coverage.json" \
            --report "$RUNNER_TEMP/golden/report.json" | tee "$RUNNER_TEMP/golden/summary.txt"
          { echo '### Kotlin vs legacy golden comparison'; echo '```'; cat "$RUNNER_TEMP/golden/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # :cloud-gcp の単体テスト（T2.7。ModeProvider）。実 GCP には接続しない（フェイクとローカルの HTTP サーバだけ）。0 件・スキップ・失敗を許さない。
      - name: Verify that the cloud-gcp unit tests actually ran
        run: |
          dir=cloud-gcp/build/test-results/test
          test -d "$dir" || { echo "::error::no cloud-gcp test results"; exit 1; }
          python3 - "$dir" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          expected = {
              "OpsStateParserTest", "CachingModeProviderTest", "CachingModeProviderConcurrencyTest",
              "GcsOpsStateSourceTest", "LocalFileModeProviderTest",
              "ModeSnapshotTest", "GoogleSignedTokenVerifierTest", "RequestPathsTest",
          }
          seen = set()
          tests = skipped = failures = errors = 0
          for f in glob.glob(sys.argv[1] + "/*.xml"):
              r = ET.parse(f).getroot()
              seen.add(r.get("name").rsplit(".", 1)[-1])
              tests += int(r.get("tests")); skipped += int(r.get("skipped")); failures += int(r.get("failures")); errors += int(r.get("errors"))
          print(f"tests={tests} skipped={skipped} failures={failures} errors={errors} classes={len(seen)}")
          missing = expected - seen
          if missing:
              sys.exit(f"cloud-gcp test classes missing from the results: {sorted(missing)}")
          if tests < 91 or skipped or failures or errors:
              sys.exit("cloud-gcp unit tests did not all run and pass")
          PY
      # 実行アプリと :persistence の起動・単体テスト（T2.8）。Docker を使わない: 実際の Tomcat（ランダムポート）・実プロセスの終了コード・
      # 偽の JWKS（ループバック）による署名検証。実 GCP・実 DB には接続しない。0 件・スキップ・失敗・期待クラスの欠落を許さない。
      - name: Verify that the app and persistence unit tests actually ran
        run: |
          python3 .github/scripts/verify_test_results.py "persistence unit" persistence/build/test-results/test 33 \
            "SchemaVersionTest,SchemaCheckClassificationTest,DbSettingsTest,MappingTest,PersistenceModuleTest,SqlTemplateTenantGuardTest,DeadlockRetryTest,BotRunAcquireContentionTest"
          python3 .github/scripts/verify_test_results.py "domain unit (incl. decision logic T3.1/T3.2, calendar T3.3, ingest T3.4)" domain/build/test-results/test 667 \
            "EvMathTest,KellyMathTest,PythonCompatTest,MarketProbabilityTest,SnapshotFiltersTest,MarketBlendTest,WinStakeTest,WinDecisionEvaluatorTest,PlackettLuceTest,ComboOddsTest,ComboStrategyTest,WinDecisionComboTest,SourceVersionTest,TransitionsTest,ScheduleEventTest,CalendarOverrideTest,WatchWindowTest,EffectiveCalendarTest,ScheduleUpdaterTest,CalendarCheckPolicyTest,CalendarCheckServiceTest,CalendarSourceGuardTest,LeaseAndDayModelTest,EnvelopeValidatorTest,AgentAuthTest,FetchPolicyTest,HeartbeatAndBackfillTest"
          python3 .github/scripts/verify_test_results.py "golden-runner unit" golden-runner/build/test-results/test 9 "GoldenRunnerTest"
          python3 .github/scripts/verify_test_results.py "bot unit" bot/build/test-results/test 67 \
            "BotArgsParserTest,BotLauncherTest,BotJobExecutorTest,BotProcessTest,BotSpringWiringTest,JobGateTest,CycleGateTest,CalendarCheckTaskHandlerTest,CalendarSettingsParserTest"
          python3 .github/scripts/verify_test_results.py "ingest unit" ingest/build/test-results/test 31 \
            "IngestInternalApiTest,AgentApiOpsGuardTest,IngestStartupConfigTest"
          python3 .github/scripts/verify_test_results.py "dashboard unit" dashboard/build/test-results/test 30 \
            "DashboardInternalApiTest,AdminWriteGuardTest,DashboardStartupConfigTest"

  # tools/release（release-manifest の生成・検証、Dockerfile の静的検査）と tools/ci（変更判定・ゲート）の Python 単体テスト。Docker 不要
  release-tools:
    name: release tools and ci scripts (Python)
    needs: changes
    if: needs.changes.outputs.run_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (none skipped)
        run: python3 -m tools.ci.run_tests --min-tests 100

  # ゴールデンテスト基盤（T2.6）。Python は ubuntu-24.04 標準の 3.12 系を使い、minor を検証する。
  # 旧実装は公開リポジトリを固定コミットで取得する（認証・Secrets 不要）。生成結果は書き込まず、コミット済みフィクスチャとの一致を検証する
  # （フィクスチャを CI が自動更新することはない）。0 件・スキップ・不足は失敗。
  golden:
    name: golden tests (Python 3.12)
    needs: changes
    if: needs.changes.outputs.run_golden == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LEGACY_COMMIT: f7dbf69fd8940121782870de902e8c449e6ca149
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12 and dependencies
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-input -r tools/golden/requirements.txt
      - name: Fetch legacy implementation at the pinned commit (read-only, public)
        run: |
          git clone --quiet --no-checkout https://github.com/puttun777/jra-bot.git "$RUNNER_TEMP/legacy"
          git -C "$RUNNER_TEMP/legacy" checkout --quiet --detach "$LEGACY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/legacy" rev-parse HEAD)" = "$LEGACY_COMMIT"
      - name: Verify committed fixtures (schema, provenance, hashes, synthetic-only)
        run: python3 -m tools.golden.verify
      - name: Unit tests (none skipped; legacy regeneration included)
        env:
          GOLDEN_LEGACY_PATH: ${{ runner.temp }}/legacy
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m tools.golden.run_tests --min-tests 45 --max-skipped 0
      - name: Regenerate from legacy and require an exact match (no write)
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m tools.golden.generate --legacy-path "$RUNNER_TEMP/legacy" --check
      - name: Comparator smoke test (self-comparison passes, perturbed and missing results fail)
        run: |
          python3 - <<'PY'
          import json, pathlib, copy
          fx = {p.stem: json.loads(p.read_text()) for p in pathlib.Path("tools/golden/fixtures").glob("*.json") if p.name != "manifest.json"}
          ok = {"schema_version": 1, "results": {k: v["expected_output"] for k, v in fx.items()}}
          pathlib.Path("ok.json").write_text(json.dumps(ok))
          bad = copy.deepcopy(ok); bad["results"]["GD01-EV-001"]["results"][5]["outcome"]["value"] += 1e-6
          pathlib.Path("bad.json").write_text(json.dumps(bad))
          miss = copy.deepcopy(ok); del miss["results"]["G1-MODEL-001"]
          pathlib.Path("miss.json").write_text(json.dumps(miss))
          PY
          python3 -m tools.golden.compare --actual ok.json
          rc=0; python3 -m tools.golden.compare --actual bad.json || rc=$?; test "$rc" = 1
          rc=0; python3 -m tools.golden.compare --actual miss.json || rc=$?; test "$rc" = 2

  # DB 統合テスト（T2.3 + T2.4 + T2.8）: Flyway V1/V2/R__grants と CLI（:db-migration）、Doma の Repository（:persistence）、実行アプリの起動・Job を、
  # 使い捨ての MySQL コンテナ（Testcontainers）に対して検証する。MySQL 8.4 LTS（本番の暫定基準: D-046）と 9.7 LTS（互換性の確認: G-DB-0）。
  # 実行範囲は変更内容で決まる（tools/ci/classify.py）: マトリクス（8.4 だけ / 8.4 + 9.7）とスイート（migration, persistence, apps）。
  # Docker が使えない・イメージを取得できない場合は**失敗する**（スキップして成功扱いにしない）。使うのは CI 専用の一時的なテスト値だけ。
  db-integration:
    name: db integration (MySQL ${{ matrix.mysql }})
    needs: changes
    if: needs.changes.outputs.db_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql: ${{ fromJSON(needs.changes.outputs.db_matrix) }}
    env:
      MYSQL_IMAGE: mysql:${{ matrix.mysql }}
      DB_SUITES: ${{ needs.changes.outputs.db_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Docker and image
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker pull "$MYSQL_IMAGE"
          docker image inspect "$MYSQL_IMAGE" --format '{{.Id}} {{.Created}}'
      - name: Integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: contains(env.DB_SUITES, 'migration')
        run: ./gradlew :db-migration:integrationTest --stacktrace
      # 「実行されたテストが 0 件」「スキップがある」「失敗がある」をすべて失敗にする（黙って緑にしない）。
      - name: Verify that the integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'migration')
        run: |
          dir=db-migration/build/test-results/integrationTest
          test -d "$dir" || { echo "::error::no integrationTest results"; exit 1; }
          python3 - "$dir" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          tests = skipped = failures = errors = 0
          for f in glob.glob(sys.argv[1] + "/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests")); skipped += int(r.get("skipped")); failures += int(r.get("failures")); errors += int(r.get("errors"))
          print(f"tests={tests} skipped={skipped} failures={failures} errors={errors}")
          if tests < 44 or skipped or failures or errors:
              sys.exit("integration tests did not all run and pass")
          PY
      # :persistence の統合テスト（T2.4）。8.4 / 9.7 の両ジョブで必ず実行する（db-migration のテストが失敗しても実行して結果を両方残す）。
      - name: Persistence integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: always() && contains(env.DB_SUITES, 'persistence')
        run: ./gradlew :persistence:integrationTest --stacktrace
      - name: Verify that the persistence integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'persistence')
        run: |
          dir=persistence/build/test-results/integrationTest
          test -d "$dir" || { echo "::error::no persistence integrationTest results"; exit 1; }
          python3 - "$dir" <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          expected = {
              "WiringIntegrationTest", "RaceRepositoryIntegrationTest", "OddsSnapshotRepositoryIntegrationTest",
              "BotRunRepositoryIntegrationTest", "SignalRepositoryIntegrationTest", "RaceScheduleRepositoryIntegrationTest",
              "AppUserRepositoryIntegrationTest", "TenantIsolationIntegrationTest", "TimeConversionIntegrationTest",
              "EnumContractIntegrationTest", "PermissionsIntegrationTest", "SchemaVersionVerifierIntegrationTest",
              "RaceDayRepositoryIntegrationTest", "ScheduleEventRepositoryIntegrationTest", "CalendarOverrideRepositoryIntegrationTest",
              "BotRunLeaseConcurrencyIntegrationTest", "DeadlockRetryIntegrationTest", "IngestStoresIntegrationTest",
          }
          seen = set()
          tests = skipped = failures = errors = 0
          for f in glob.glob(sys.argv[1] + "/*.xml"):
              r = ET.parse(f).getroot()
              seen.add(r.get("name").rsplit(".", 1)[-1])
              tests += int(r.get("tests")); skipped += int(r.get("skipped")); failures += int(r.get("failures")); errors += int(r.get("errors"))
          print(f"tests={tests} skipped={skipped} failures={failures} errors={errors} classes={len(seen)}")
          missing = expected - seen
          if missing:
              sys.exit(f"integration test classes missing from the results: {sorted(missing)}")
          if tests < 161 or skipped or failures or errors:
              sys.exit("persistence integration tests did not all run and pass")
          PY
      # 実行アプリの統合テスト（T2.8）: /internal/ready のスキーマ版・DB 停止/復旧、Job の終了コード（DB 不達 75 とスキーマ不足 1 の区別）、
      # 非 NORMAL のモードで DB に接続しないこと（サーバの接続数）。8.4 / 9.7 の両ジョブで必ず実行する。
      - name: App integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: always() && contains(env.DB_SUITES, 'apps')
        run: ./gradlew :bot:integrationTest :ingest:integrationTest :dashboard:integrationTest --continue --stacktrace
      - name: Verify that the app integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'apps')
        run: |
          python3 .github/scripts/verify_test_results.py "bot integration" bot/build/test-results/integrationTest 31 "BotJobIntegrationTest,CalendarCheckIntegrationTest"
          python3 .github/scripts/verify_test_results.py "ingest integration" ingest/build/test-results/integrationTest 44 "IngestReadyIntegrationTest,AgentAuthIntegrationTest,IngestIdempotencyIntegrationTest,IngestPipelineIntegrationTest"
          python3 .github/scripts/verify_test_results.py "dashboard integration" dashboard/build/test-results/integrationTest 9 "DashboardReadyIntegrationTest"

  # イメージのビルドとスモーク + ドライラン manifest（images.yml）。push も認証もしない。Dockerfile・リリース関連・ビルド定義が変わったときと、フル検証のときだけ
  images:
    needs: changes
    if: needs.changes.outputs.run_images == 'true'
    uses: ./.github/workflows/images.yml

  # Connector/J 26.x の互換性確認（非ゲート。採否は別判断）。Connector/J・DB ドライバ関連の依存設定が変わったときと、フル検証のときだけ
  connectorj26:
    needs: changes
    if: needs.changes.outputs.run_connectorj26 == 'true'
    uses: ./.github/workflows/compat-connectorj26.yml

  # 最終集約チェック。**分岐保護の required check はこれだけ**にする。常に実行され、docs だけの変更でも正常に終わる。
  # 実行が必要と判定されたジョブが success でなければ失敗（skipped・cancelled も失敗）。変更判定が失敗したら失敗（fail closed）。
  ci-gate:
    name: ci gate
    if: always()
    needs: [changes, build, release-tools, golden, db-integration, images, connectorj26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/__init__.py
            tools/ci
      - name: Evaluate (a skipped job is reported as not tested, never as passed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m tools.ci.gate
