name: ci

# 変更内容に応じて重いジョブだけを実行する（GitHub Free の月 2,000 分枠の節約。tools/src/ci/classify.ts）。
# - `changes` が変更ファイルを分類する（fail closed: 分類・差分取得に失敗したら全部実行）。docs だけの変更は `changes` と `ci gate` だけ。
# - **分岐保護の required check は `ci gate` だけにする**。ワークフロー全体を paths で止めると required check が Pending のまま残るため使わない。
#   `ci gate` は常に実行され、実行が必要なジョブが success でなければ失敗する。skipped を『テストした』とは数えない（要約に『未実施』と出す）。
# - 契機: PR、main への push（push 前後の差分で同じ判定）、手動（フル検証）、月次（フル検証 + Connector/J 26.x）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 1 * *" # 毎月 1 日 18:23 UTC（日本時間 2 日 03:23）。フル検証

# 最小権限。Secrets は使わない・クラウドの認証情報も使わない（PR から本番へアクセスしない）。
permissions:
  contents: read

# PR は新しい push で古い実行を止める。main の push は止めない（途中のコミットの検証を落とさない）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更判定 + 秘密/実データの混入検査（常に実行。ジョブ数を増やさないよう 1 つにまとめる: 課金はジョブごとに分単位で切り上げ）
  changes:
    name: changes and repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_release: ${{ steps.classify.outputs.run_release }}
      run_images: ${{ steps.classify.outputs.run_images }}
      run_connectorj26: ${{ steps.classify.outputs.run_connectorj26 }}
      run_agent: ${{ steps.classify.outputs.run_agent }}
      run_agent_windows: ${{ steps.classify.outputs.run_agent_windows }}
      db_matrix: ${{ steps.classify.outputs.db_matrix }}
      db_suites: ${{ steps.classify.outputs.db_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 差分（PR の merge コミットの第 1 親、push の before）を取るため
      - uses: ./.github/actions/setup-tools
      - name: Classify changed files (fail closed)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node build/tools/src/main.js classify
      - name: Check tracked files (secrets / real data)
        run: bash .github/scripts/check-repo-hygiene.sh
      # 設定・契約の整合（Flyway 版 = requiredSchemaVersion、bot-run の必須環境変数 = スモーク設定、DAO の表 = Flyway + GRANT）。push 前の preflight と同じ検査
      - name: Consistency checks (schema version, required env vars, grants)
        run: node build/tools/src/main.js consistency

  build:
    name: build (Temurin 25)
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_JDK: "25" # JdkRuntimeTest が、テストの JVM が 25 であることを検証する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Wrapper jar の検証もここで行われる（既定で有効）。Gradle のキャッシュは main 以外では書かない（PR が main 用のキャッシュを汚染しない）。
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ./.github/actions/setup-tools
      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains
      # Kotlin コンパイル + 単体テスト + ktlint + checkModuleDependencies（+ build-logic の依存規則テスト）
      - name: Build and check
        run: ./gradlew build --stacktrace
      - name: Dependency rules (explicit)
        run: ./gradlew checkModuleDependencies ktlintCheck
      # Kotlin（:domain）の計算結果と、旧 Python（固定コミット f7dbf69）のフィクスチャの比較（T3.1）。各ケース自身の comparison_rules（許容誤差・型・キー・順序）で比較し、
      # Kotlin が『対応』と申告したケースだけを比べる。未対応のケースは成功に数えず、ケース数・呼び出し数を別に報告する（対応表は tools/golden/catalog.json の kotlin_port）。
      # フィクスチャは CI が書き換えない（sha256・来歴・合成データ・正準形式を check の中の verify で確認）。Kotlin だけで動く（D-258。旧 Python の verify・kotlin_compare は削除）。
      - name: Kotlin vs legacy golden comparison
        run: |
          # tee の後ろでも check の終了コード（1 = 不適合・差分、2 = 形式不正）で失敗させる（既定の bash -e には pipefail が無い）
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/golden"
          ./gradlew :golden-runner:run --stacktrace --args="check --fixtures $PWD/tools/golden/fixtures --catalog $PWD/tools/golden/catalog.json --report $RUNNER_TEMP/golden/report.json" | tee "$RUNNER_TEMP/golden/summary.txt"
          { echo '### Kotlin vs legacy golden comparison'; echo '```'; cat "$RUNNER_TEMP/golden/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # :cloud-gcp の単体テスト（T2.7。ModeProvider）。実 GCP には接続しない（フェイクとローカルの HTTP サーバだけ）。0 件・スキップ・失敗を許さない。
      - name: Verify that the cloud-gcp unit tests actually ran
        run: |
          node build/tools/src/main.js verify-junit --label "cloud-gcp unit" --dir cloud-gcp/build/test-results/test --min 102 \
            --classes "OpsStateParserTest,CachingModeProviderTest,CachingModeProviderConcurrencyTest,GcsOpsStateSourceTest,LocalFileModeProviderTest,ModeSnapshotTest,GoogleSignedTokenVerifierTest,RequestPathsTest,GcsStoresTest,GoogleObjectClientHttpTest"
      # 実行アプリと :persistence の起動・単体テスト（T2.8）。Docker を使わない: 実際の Tomcat（ランダムポート）・実プロセスの終了コード・
      # 偽の JWKS（ループバック）による署名検証。実 GCP・実 DB には接続しない。0 件・スキップ・失敗・期待クラスの欠落を許さない。
      - name: Verify that the app and persistence unit tests actually ran
        run: |
          node build/tools/src/main.js verify-junit --label "persistence unit" --dir persistence/build/test-results/test --min 33 \
            --classes "SchemaVersionTest,SchemaCheckClassificationTest,DbSettingsTest,MappingTest,PersistenceModuleTest,SqlTemplateTenantGuardTest,DeadlockRetryTest,BotRunAcquireContentionTest"
          node build/tools/src/main.js verify-junit --label "domain unit (incl. decision logic T3.1/T3.2, calendar T3.3, ingest T3.4, ML T3.6-A)" --dir domain/build/test-results/test --min 822 \
            --classes "EvMathTest,KellyMathTest,PythonCompatTest,MarketProbabilityTest,SnapshotFiltersTest,MarketBlendTest,WinStakeTest,WinDecisionEvaluatorTest,PlackettLuceTest,ComboOddsTest,ComboStrategyTest,WinDecisionComboTest,SourceVersionTest,TransitionsTest,ScheduleEventTest,CalendarOverrideTest,WatchWindowTest,EffectiveCalendarTest,ScheduleUpdaterTest,CalendarCheckPolicyTest,CalendarCheckServiceTest,CalendarSourceGuardTest,LeaseAndDayModelTest,EnvelopeValidatorTest,AgentAuthTest,FetchPolicyTest,HeartbeatAndBackfillTest,PedigreeHashTest,CanonicalJsonTest,StrictJsonTest,FeatureSchemaTest,FeatureSchemaFixtureTest,FeatureBuilderTest,ModelLoaderTest,ProbabilityPipelineTest,MlEndToEndTest,DatasetExporterTest,HorseMasterAtTimeTest,DatasetPublisherTest,TenantBoundaryContractTest"
          node build/tools/src/main.js verify-junit --label "legacy-import unit (D-271)" --dir legacy-import/build/test-results/test --min 31 --classes "PreflightTest,ExtractTest,ConvertTest,TransformTest"
          node build/tools/src/main.js verify-junit --label "golden-runner unit" --dir golden-runner/build/test-results/test --min 36 --classes "GoldenRunnerTest,GoldenMlTest,GoldenVerifyCompareTest"
          node build/tools/src/main.js verify-junit --label "bot unit" --dir bot/build/test-results/test --min 75 \
            --classes "BotArgsParserTest,BotLauncherTest,BotJobExecutorTest,BotProcessTest,BotSpringWiringTest,JobGateTest,CycleGateTest,CalendarCheckTaskHandlerTest,CalendarSettingsParserTest,ExportDatasetTaskHandlerTest"
          node build/tools/src/main.js verify-junit --label "ingest unit" --dir ingest/build/test-results/test --min 35 \
            --classes "IngestInternalApiTest,AgentApiOpsGuardTest,IngestStartupConfigTest,AgentSigningVectorsTest,PlanProviderTest"
          node build/tools/src/main.js verify-junit --label "dashboard unit" --dir dashboard/build/test-results/test --min 69 \
            --classes "DashboardInternalApiTest,AdminWriteGuardTest,DashboardStartupConfigTest,SecurityHeadersFilterTest,MlModelApiTest,AgentAdminApiTest"
          node build/tools/src/main.js verify-junit --label "ml-train unit (Kotlin. D-257)" --dir ml-train/build/test-results/test --min 47 \
            --classes "PythonReferenceTest,PythonReferencePipelineTest,TrainJobTest,LegacyPickleTest,ModelJsonTest,LogisticRoundoffTest,LauncherTest"

  # TypeScript のツール（tools/: 変更判定・ゲート・整合検査・JUnit 件数検査・preflight・release-manifest・イメージスモーク）の
  # lint（Biome）・strict の型検査（tsc）・単体試験（node:test）。0 件・スキップ・todo・失敗を成功にしない（tools/run-tests.mjs が JUnit XML で検査）。Docker 不要
  release-tools:
    name: release tools and ci scripts (TypeScript)
    needs: changes
    if: needs.changes.outputs.run_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # preflight の試験が origin/main とのマージベースを使う
      - uses: ./.github/actions/setup-tools
      - name: Lint and format (Biome)
        run: npm run --silent lint
      - name: Unit tests (none skipped)
        run: node tools/run-tests.mjs
      # ダッシュボードの画面（dashboard/src/main/ts。D-263）: strict の型検査（ブラウザ用と試験用の tsconfig）と node:test（件数・skip を検査）
      - name: Dashboard frontend (TypeScript) type check and unit tests
        run: |
          npm run --silent build:frontend
          npm run --silent test:frontend

  # DB 統合テスト（T2.3 + T2.4 + T2.8）: Flyway V1/V2/R__grants と CLI（:db-migration）、Doma の Repository（:persistence）、実行アプリの起動・Job を、
  # 使い捨ての MySQL コンテナ（Testcontainers）に対して検証する。MySQL 8.4 LTS（本番の暫定基準: D-046）と 9.7 LTS（互換性の確認: G-DB-0）。
  # 実行範囲は変更内容で決まる（tools/src/ci/classify.ts）: マトリクス（8.4 だけ / 8.4 + 9.7）とスイート（migration, persistence, apps）。
  # Docker が使えない・イメージを取得できない場合は**失敗する**（スキップして成功扱いにしない）。使うのは CI 専用の一時的なテスト値だけ。
  db-integration:
    name: db integration (MySQL ${{ matrix.mysql }})
    needs: changes
    if: needs.changes.outputs.db_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql: ${{ fromJSON(needs.changes.outputs.db_matrix) }}
    env:
      MYSQL_IMAGE: mysql:${{ matrix.mysql }}
      DB_SUITES: ${{ needs.changes.outputs.db_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ./.github/actions/setup-tools
      # Kotlin ingest と Windows エージェント（C#）の結合テスト用（AgentInteropIntegrationTest）。ドライバ jraagent-interop をビルドして渡す
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: contains(env.DB_SUITES, 'apps')
        with:
          dotnet-version: "10.0.113"
      - name: Agent interop driver (for the interop test)
        if: contains(env.DB_SUITES, 'apps')
        run: |
          dotnet build agent/cs/tools/JraAgent.Interop/JraAgent.Interop.csproj -c Release -p:RestoreLockedMode=true
          echo "AGENT_INTEROP=$PWD/agent/cs/tools/JraAgent.Interop/bin/Release/net10.0/jraagent-interop" >> "$GITHUB_ENV"
      - name: Docker and image
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker pull "$MYSQL_IMAGE"
          docker image inspect "$MYSQL_IMAGE" --format '{{.Id}} {{.Created}}'
      - name: Integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: contains(env.DB_SUITES, 'migration')
        run: ./gradlew :db-migration:integrationTest --stacktrace
      # 「実行されたテストが 0 件」「スキップがある」「失敗がある」をすべて失敗にする（黙って緑にしない）。
      - name: Verify that the integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'migration')
        run: |
          node build/tools/src/main.js verify-junit --label "db-migration integration" --dir db-migration/build/test-results/integrationTest --min 44
      # :persistence の統合テスト（T2.4）。8.4 / 9.7 の両ジョブで必ず実行する（db-migration のテストが失敗しても実行して結果を両方残す）。
      - name: Persistence integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: always() && contains(env.DB_SUITES, 'persistence')
        run: ./gradlew :persistence:integrationTest --stacktrace
      - name: Verify that the persistence integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'persistence')
        run: |
          node build/tools/src/main.js verify-junit --label "persistence integration" --dir persistence/build/test-results/integrationTest --min 182 \
            --classes "WiringIntegrationTest,RaceRepositoryIntegrationTest,OddsSnapshotRepositoryIntegrationTest,BotRunRepositoryIntegrationTest,SignalRepositoryIntegrationTest,RaceScheduleRepositoryIntegrationTest,AppUserRepositoryIntegrationTest,TenantIsolationIntegrationTest,TimeConversionIntegrationTest,EnumContractIntegrationTest,PermissionsIntegrationTest,SchemaVersionVerifierIntegrationTest,RaceDayRepositoryIntegrationTest,ScheduleEventRepositoryIntegrationTest,CalendarOverrideRepositoryIntegrationTest,BotRunLeaseConcurrencyIntegrationTest,DeadlockRetryIntegrationTest,IngestStoresIntegrationTest,MlModelRegistryIntegrationTest,MlModelTrainingRegistryIntegrationTest,MlSourceIntegrationTest,AgentAdminIntegrationTest"
      # 実行アプリの統合テスト（T2.8）: /internal/ready のスキーマ版・DB 停止/復旧、Job の終了コード（DB 不達 75 とスキーマ不足 1 の区別）、
      # 非 NORMAL のモードで DB に接続しないこと（サーバの接続数）。8.4 / 9.7 の両ジョブで必ず実行する。
      - name: App integration tests (Testcontainers, ${{ env.MYSQL_IMAGE }})
        if: always() && contains(env.DB_SUITES, 'apps')
        run: ./gradlew :bot:integrationTest :ingest:integrationTest :dashboard:integrationTest --continue --stacktrace
      - name: Verify that the app integration tests actually ran
        if: always() && contains(env.DB_SUITES, 'apps')
        run: |
          node build/tools/src/main.js verify-junit --label "bot integration" --dir bot/build/test-results/integrationTest --min 42 --classes "BotJobIntegrationTest,CalendarCheckIntegrationTest,MlTrainInteropIntegrationTest,ReconcileIntegrationTest,RetentionIntegrationTest"
          node build/tools/src/main.js verify-junit --label "ingest integration" --dir ingest/build/test-results/integrationTest --min 50 --classes "IngestReadyIntegrationTest,AgentAuthIntegrationTest,IngestIdempotencyIntegrationTest,IngestPipelineIntegrationTest,AgentInteropIntegrationTest"
          node build/tools/src/main.js verify-junit --label "dashboard integration" --dir dashboard/build/test-results/integrationTest --min 17 --classes "DashboardReadyIntegrationTest,ReadAdminApiMySqlIntegrationTest"

  # Windows 取得エージェント（agent/cs。C#/.NET 10。D-261）。Gradle に組み込まない独立プロジェクト。Linux で restore（lock file どおり）・ビルド（警告はエラー）・
  # 単体・SQLite WAL・偽サーバ・子プロセスのワーカー（Fake の JV-Link）・署名・ビーコン・再送と復旧・CLI・PoC の Mock を検査する。実 JV-Link・SDK・実トークンは使わない。
  agent:
    name: agent dotnet (linux)
    needs: changes
    if: needs.changes.outputs.run_agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.113"
      - uses: ./.github/actions/setup-tools
      - name: Restore (locked) and build (warnings are errors)
        working-directory: agent/cs
        run: |
          dotnet --version
          dotnet restore JraAgent.slnx --locked-mode
          dotnet build JraAgent.slnx --no-restore -c Release
      - name: Tests
        working-directory: agent/cs
        run: |
          mkdir -p "$RUNNER_TEMP/agent-junit"
          tests/JraAgent.Core.Tests/bin/Release/net10.0/JraAgent.Core.Tests -reporter quiet -result-junit "$RUNNER_TEMP/agent-junit/agent.xml"
      # 0 件・失敗・想定外のスキップを成功扱いにしない。スキップを許すのは Windows 専用の 4 件（WindowsTests）だけ
      - name: Verify that the tests actually ran
        if: always()
        run: |
          node build/tools/src/main.js verify-junit --label "agent (linux)" --dir "$RUNNER_TEMP/agent-junit" --min 300 --max-skipped 4 \
            --classes "SigningTests,BeaconAndModesTests,QueueTests,SenderTests,WorkerTests,FetcherTests,RunnerScenarioTests,PlanUpdateLockTests,ConfigAndSecretsTests,CliTests,WindowsTests,ReviewRegressionTests"

  # Windows 固有部分（DPAPI・ジョブオブジェクト・ファイルロック・ワーカーのハング回復・COM 登録の確認）と、全試験の Windows での実行。SDK・JV-Link は不要。
  # Windows ランナーは分単位の課金が 2 倍なので、Windows 固有のファイルが変わったときとフル検証のときだけ実行する（毎コミットは不要。classify の agent_windows）。
  agent-windows:
    name: agent windows
    needs: changes
    if: needs.changes.outputs.run_agent_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.113"
      - uses: ./.github/actions/setup-tools
      - name: Restore (locked) and build (warnings are errors)
        working-directory: agent/cs
        run: |
          dotnet --version
          dotnet restore JraAgent.slnx --locked-mode
          dotnet build JraAgent.slnx --no-restore -c Release
      - name: All tests on Windows
        working-directory: agent/cs
        run: |
          mkdir -p "$RUNNER_TEMP/agent-junit"
          tests/JraAgent.Core.Tests/bin/Release/net10.0/JraAgent.Core.Tests.exe -reporter quiet -result-junit "$RUNNER_TEMP/agent-junit/agent.xml"
      # Windows では WindowsTests を含む全件が実行されること。スキップを許すのは Linux 専用の 5 件（sh を使う偽ワーカー 3・flock(1)・COM の拒否）だけ
      - name: Verify that the Windows tests actually ran
        if: always()
        run: |
          node build/tools/src/main.js verify-junit --label "agent (windows)" --dir "$RUNNER_TEMP/agent-junit" --min 300 --max-skipped 5 --classes "WindowsTests,WorkerTests,CliTests,QueueTests,ReviewRegressionTests"

  # イメージのビルドとスモーク + ドライラン manifest（images.yml）。push も認証もしない。Dockerfile・リリース関連・ビルド定義が変わったときと、フル検証のときだけ
  images:
    needs: changes
    if: needs.changes.outputs.run_images == 'true'
    uses: ./.github/workflows/images.yml

  # Connector/J 26.x の互換性確認（非ゲート。採否は別判断）。Connector/J・DB ドライバ関連の依存設定が変わったときと、フル検証のときだけ
  connectorj26:
    needs: changes
    if: needs.changes.outputs.run_connectorj26 == 'true'
    uses: ./.github/workflows/compat-connectorj26.yml

  # 最終集約チェック。**分岐保護の required check はこれだけ**にする。常に実行され、docs だけの変更でも正常に終わる。
  # 実行が必要と判定されたジョブが success でなければ失敗（skipped・cancelled も失敗）。変更判定が失敗したら失敗（fail closed）。
  ci-gate:
    name: ci gate
    if: always()
    needs: [changes, build, release-tools, db-integration, images, connectorj26, agent, agent-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            tools/src
            tools/tsconfig.json
            package.json
            package-lock.json
      - uses: ./.github/actions/setup-tools
      - name: Evaluate (a skipped job is reported as not tested, never as passed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node build/tools/src/main.js gate
