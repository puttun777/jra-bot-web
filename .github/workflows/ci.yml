name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 最小権限。Secrets は使わない・クラウドの認証情報も使わない（PR から本番へアクセスしない）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Temurin 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_JDK: "25" # JdkRuntimeTest が、テストの JVM が 25 であることを検証する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Wrapper jar の検証もここで行われる（既定で有効）。キャッシュは読み取りのみ（main 以外では書かない）。
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains
      # Kotlin コンパイル + 単体テスト + ktlint + checkModuleDependencies（+ build-logic の依存規則テスト）
      - name: Build and check
        run: ./gradlew build --stacktrace
      - name: Dependency rules (explicit)
        run: ./gradlew checkModuleDependencies ktlintCheck

  repo-hygiene:
    name: repo hygiene (secrets / real data)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files
        run: bash .github/scripts/check-repo-hygiene.sh

  # Docker / Testcontainers による DB 統合テストは、対象のテストが存在する T2.3（Flyway）以降に追加する。
  # 現時点では実施していない（未実施）。
